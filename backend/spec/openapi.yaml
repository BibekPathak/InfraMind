openapi: "3.1.0"
info:
  title: InfraMind API
  version: "0.1.0"
  description: Autonomous Infrastructure Intelligence Platform

servers:
  - url: http://localhost:8080/api/v1

paths:
  /health:
    get:
      summary: Service health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  service: { type: string }

  /auth/login:
    post:
      summary: Authenticate and receive JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"

  /auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterUserRequest"
      responses:
        "201":
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"

  /assets:
    get:
      summary: List all assets
      responses:
        "200":
          description: Asset list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"
    post:
      summary: Create an asset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssetRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"

  /assets/{id}:
    get:
      summary: Get asset by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Asset detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
    delete:
      summary: Soft delete an asset
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted

  /assets/{id}/devices:
    get:
      summary: List devices for an asset
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Device list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Device"

  /assets/{id}/autonomy:
    get:
      summary: Get asset autonomy mode
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Autonomy mode
          content:
            application/json:
              schema:
                type: object
                properties:
                  autonomyMode: { type: string, enum: [manual, advisory, autonomous] }
    patch:
      summary: Update asset autonomy mode
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [autonomyMode]
              properties:
                autonomyMode: { type: string, enum: [manual, advisory, autonomous] }
      responses:
        "200":
          description: Updated asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"

  /asset-types:
    get:
      summary: List all asset types
      responses:
        "200":
          description: Asset type list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssetType"
    post:
      summary: Create an asset type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssetTypeRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetType"

  /asset-types/{type}:
    get:
      summary: Get asset type by name
      parameters:
        - name: type
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Asset type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetType"
    put:
      summary: Update an asset type
      parameters:
        - name: type
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAssetTypeRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetType"

  /devices:
    post:
      summary: Register a device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDeviceRequest"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationResponse"

  /devices/{id}:
    get:
      summary: Get device by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Device detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"

  /devices/{id}/heartbeat:
    post:
      summary: Update device heartbeat
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Heartbeat updated

  /devices/{id}/config:
    get:
      summary: Get device configuration
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Device configuration
          content:
            application/json:
              schema:
                type: object
    put:
      summary: Update device configuration
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                config:
                  type: object
      responses:
        "200":
          description: Configuration updated
          content:
            application/json:
              schema:
                type: object

  /devices/{id}/telemetry:
    get:
      summary: Query telemetry history
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Telemetry points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Telemetry"

  /telemetry/live:
    get:
      summary: Get latest telemetry for a device
      parameters:
        - name: device_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Latest telemetry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Telemetry"

  /telemetry/aggregate:
    get:
      summary: Get aggregated telemetry over time windows
      parameters:
        - name: device_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: window
          in: query
          schema: { type: string, default: "5m", description: "time bucket (e.g. 1m, 5m, 1h)" }
      responses:
        "200":
          description: Aggregated telemetry
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AggregatedTelemetry"

  /telemetry/ws:
    get:
      summary: WebSocket live stream
      description: |
        Upgrades to WebSocket. Sends typed event envelope:
        ```json
        {"type": "telemetry.updated", "timestamp": "...", "asset_id": "...", "payload": {}}
        ```
      parameters:
        - name: device_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "101":
          description: Switching Protocols (WebSocket upgrade)

  /health/{deviceId}:
    get:
      summary: Calculate health score for a device
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: temperature
          in: query
          schema: { type: number }
        - name: current
          in: query
          schema: { type: number }
        - name: voltage
          in: query
          schema: { type: number }
        - name: humidity
          in: query
          schema: { type: number }
      responses:
        "200":
          description: Health score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthScore"

  /health/{deviceId}/analysis:
    get:
      summary: Full AI analysis for a device (health, anomalies, predictions, recommendations)
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: temperature
          in: query
          schema: { type: number }
        - name: current
          in: query
          schema: { type: number }
        - name: voltage
          in: query
          schema: { type: number }
        - name: humidity
          in: query
          schema: { type: number }
      responses:
        "200":
          description: Full AI analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResponse"

  /alerts:
    get:
      summary: List alerts with optional filters
      parameters:
        - name: device_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [open, acknowledged, resolved] }
        - name: severity
          in: query
          schema: { type: string, enum: [info, warning, critical] }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Alert list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"

  /alerts/{id}:
    get:
      summary: Get alert by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Alert detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"

  /alerts/{id}/acknowledge:
    patch:
      summary: Acknowledge an alert
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Alert acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"

  /alerts/{id}/resolve:
    patch:
      summary: Resolve an alert
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Alert resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"

  /twins:
    get:
      summary: List all digital twins
      responses:
        "200":
          description: Twin list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DigitalTwin"

  /twins/{id}:
    get:
      summary: Get digital twin by asset ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Digital twin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DigitalTwin"

  /assets/{id}/twin:
    get:
      summary: Get digital twin for an asset
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Digital twin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DigitalTwin"

  /twins/{id}/events:
    get:
      summary: List maintenance events for a twin
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Event list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TwinEvent"
    post:
      summary: Add a maintenance event to a twin
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddTwinEventRequest"
      responses:
        "200":
          description: Event added, returns updated twin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DigitalTwin"

  /work-orders:
    get:
      summary: List work orders with optional filters
      parameters:
        - name: asset_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [open, assigned, in_progress, completed, cancelled] }
        - name: priority
          in: query
          schema: { type: string, enum: [low, medium, high, critical] }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Work order list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkOrder"
    post:
      summary: Create a work order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkOrderRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkOrder"

  /work-orders/{id}:
    get:
      summary: Get work order by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Work order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkOrder"

  /work-orders/{id}/assign:
    patch:
      summary: Assign a work order to an engineer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignWorkOrderRequest"
      responses:
        "200":
          description: Assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkOrder"

  /work-orders/{id}/status:
    patch:
      summary: Update work order status
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkOrderStatusUpdate"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkOrder"

  /work-orders/{id}/timeline:
    get:
      summary: Get work order incident timeline
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Timeline events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimelineEvent"

  /actions:
    get:
      summary: List autonomous actions with optional filters
      parameters:
        - name: asset_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [proposed, approved, rejected, executed, failed] }
        - name: type
          in: query
          schema: { type: string, enum: [command, restart, config_change, notification] }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Action list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Action"
    post:
      summary: Propose an autonomous action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposeActionRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Action"

  /actions/{id}:
    get:
      summary: Get action by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Action detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Action"

  /actions/{id}/approve:
    patch:
      summary: Approve an action
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Action"

  /actions/{id}/reject:
    patch:
      summary: Reject an action
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Action"

  /organizations:
    get:
      summary: List organizations (admin only)
      responses:
        "200":
          description: Organization list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organization"
    post:
      summary: Create an organization (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"

  /organizations/{id}:
    get:
      summary: Get organization by ID (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Organization detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
    patch:
      summary: Update an organization (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"

  /audit-logs:
    get:
      summary: List audit logs for the current organization
      parameters:
        - name: resource_type
          in: query
          schema: { type: string }
        - name: action
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Audit log list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"

components:
  schemas:
    Asset:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string }
        autonomyMode: { type: string, enum: [manual, advisory, autonomous] }
        location: { type: object }
        metadata: { type: object }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateAssetRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        type: { type: string, default: transformer }
        location: { type: object }
        metadata: { type: object }

    Device:
      type: object
      properties:
        id: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        firmwareVersion: { type: string }
        status: { type: string }
        location: { type: object }
        lastHeartbeat: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RegisterDeviceRequest:
      type: object
      required: [assetId]
      properties:
        assetId: { type: string, format: uuid }
        firmwareVersion: { type: string }
        location: { type: object }

    RegistrationResponse:
      type: object
      properties:
        device:
          $ref: "#/components/schemas/Device"
        mqttUsername: { type: string }
        mqttPassword: { type: string }

    Telemetry:
      type: object
      properties:
        time: { type: string, format: date-time }
        deviceId: { type: string, format: uuid }
        temperature: { type: number }
        current: { type: number }
        voltage: { type: number }
        humidity: { type: number }
        flowRate: { type: number, nullable: true }
        pressure: { type: number, nullable: true }
        vibration: { type: number, nullable: true }
        rpm: { type: number, nullable: true }
        outputPower: { type: number, nullable: true }

    AssetType:
      type: object
      properties:
        type: { type: string }
        displayName: { type: string }
        metrics:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              unit: { type: string }
        thresholds: { type: object }
        healthWeights: { type: object }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateAssetTypeRequest:
      type: object
      required: [type, displayName]
      properties:
        type: { type: string }
        displayName: { type: string }
        metrics:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              unit: { type: string }
        thresholds: { type: object }
        healthWeights: { type: object }

    UpdateAssetTypeRequest:
      type: object
      properties:
        displayName: { type: string }
        metrics:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              unit: { type: string }
        thresholds: { type: object }
        healthWeights: { type: object }
        active: { type: boolean }

    HealthScore:
      type: object
      properties:
        score: { type: number }
        level: { type: string, enum: [healthy, warning, critical] }
        factors:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              impact: { type: number }

    AnalysisResponse:
      type: object
      properties:
        healthScore: { type: number }
        healthLevel: { type: string, enum: [healthy, warning, critical] }
        healthFactors:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              impact: { type: number }
              details: { type: string }
        anomalies:
          type: array
          items:
            $ref: "#/components/schemas/AnomalyResult"
        failurePrediction:
          $ref: "#/components/schemas/FailurePredictionResult"
        recommendations:
          type: array
          items:
            $ref: "#/components/schemas/RecommendationResult"

    AnomalyResult:
      type: object
      properties:
        metric: { type: string }
        severity: { type: string, enum: [info, warning, critical] }
        description: { type: string }
