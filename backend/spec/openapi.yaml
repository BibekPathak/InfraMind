openapi: "3.1.0"
info:
  title: InfraMind API
  version: "0.1.0"
  description: Autonomous Infrastructure Intelligence Platform

servers:
  - url: http://localhost:8080/api/v1

paths:
  /health:
    get:
      summary: Service health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  service: { type: string }

  /auth/login:
    post:
      summary: Authenticate and receive JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"

  /auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterUserRequest"
      responses:
        "201":
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"

  /assets:
    get:
      summary: List all assets
      responses:
        "200":
          description: Asset list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"
    post:
      summary: Create an asset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssetRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"

  /assets/{id}:
    get:
      summary: Get asset by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Asset detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
    delete:
      summary: Soft delete an asset
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted

  /assets/{id}/devices:
    get:
      summary: List devices for an asset
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Device list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Device"

  /devices:
    post:
      summary: Register a device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDeviceRequest"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationResponse"

  /devices/{id}:
    get:
      summary: Get device by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Device detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"

  /devices/{id}/heartbeat:
    post:
      summary: Update device heartbeat
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Heartbeat updated

  /devices/{id}/config:
    get:
      summary: Get device configuration
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Device configuration
          content:
            application/json:
              schema:
                type: object
    put:
      summary: Update device configuration
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                config:
                  type: object
      responses:
        "200":
          description: Configuration updated
          content:
            application/json:
              schema:
                type: object

  /devices/{id}/telemetry:
    get:
      summary: Query telemetry history
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Telemetry points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Telemetry"

  /telemetry/live:
    get:
      summary: Get latest telemetry for a device
      parameters:
        - name: device_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Latest telemetry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Telemetry"

  /telemetry/aggregate:
    get:
      summary: Get aggregated telemetry over time windows
      parameters:
        - name: device_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: window
          in: query
          schema: { type: string, default: "5m", description: "time bucket (e.g. 1m, 5m, 1h)" }
      responses:
        "200":
          description: Aggregated telemetry
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AggregatedTelemetry"

  /telemetry/ws:
    get:
      summary: WebSocket live stream
      description: |
        Upgrades to WebSocket. Sends typed event envelope:
        ```json
        {"type": "telemetry.updated", "timestamp": "...", "asset_id": "...", "payload": {}}
        ```
      parameters:
        - name: device_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "101":
          description: Switching Protocols (WebSocket upgrade)

  /health/{deviceId}:
    get:
      summary: Calculate health score for a device
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: temperature
          in: query
          schema: { type: number }
        - name: current
          in: query
          schema: { type: number }
        - name: voltage
          in: query
          schema: { type: number }
        - name: humidity
          in: query
          schema: { type: number }
      responses:
        "200":
          description: Health score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthScore"

  /alerts:
    get:
      summary: List alerts with optional filters
      parameters:
        - name: device_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [open, acknowledged, resolved] }
        - name: severity
          in: query
          schema: { type: string, enum: [info, warning, critical] }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Alert list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"

  /alerts/{id}:
    get:
      summary: Get alert by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Alert detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"

  /alerts/{id}/acknowledge:
    patch:
      summary: Acknowledge an alert
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Alert acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"

  /alerts/{id}/resolve:
    patch:
      summary: Resolve an alert
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Alert resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"

  /twins:
    get:
      summary: List all digital twins
      responses:
        "200":
          description: Twin list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DigitalTwin"

  /twins/{id}:
    get:
      summary: Get digital twin by asset ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Digital twin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DigitalTwin"

  /assets/{id}/twin:
    get:
      summary: Get digital twin for an asset
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Digital twin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DigitalTwin"

  /twins/{id}/events:
    get:
      summary: List maintenance events for a twin
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Event list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TwinEvent"
    post:
      summary: Add a maintenance event to a twin
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddTwinEventRequest"
      responses:
        "200":
          description: Event added, returns updated twin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DigitalTwin"

components:
  schemas:
    Asset:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string }
        location: { type: object }
        metadata: { type: object }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateAssetRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        type: { type: string, default: transformer }
        location: { type: object }
        metadata: { type: object }

    Device:
      type: object
      properties:
        id: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        firmwareVersion: { type: string }
        status: { type: string }
        location: { type: object }
        lastHeartbeat: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RegisterDeviceRequest:
      type: object
      required: [assetId]
      properties:
        assetId: { type: string, format: uuid }
        firmwareVersion: { type: string }
        location: { type: object }

    RegistrationResponse:
      type: object
      properties:
        device:
          $ref: "#/components/schemas/Device"
        mqttUsername: { type: string }
        mqttPassword: { type: string }

    Telemetry:
      type: object
      properties:
        time: { type: string, format: date-time }
        deviceId: { type: string, format: uuid }
        temperature: { type: number }
        current: { type: number }
        voltage: { type: number }
        humidity: { type: number }

    HealthScore:
      type: object
      properties:
        score: { type: number }
        level: { type: string, enum: [healthy, warning, critical] }
        factors:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              impact: { type: number }

    Alert:
      type: object
      properties:
        id: { type: string, format: uuid }
        deviceId: { type: string, format: uuid }
        severity: { type: string, enum: [info, warning, critical] }
        rule: { type: string }
        message: { type: string }
        status: { type: string, enum: [open, acknowledged, resolved] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    RegisterUserRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 6 }
        displayName: { type: string }

    TokenResponse:
      type: object
      properties:
        accessToken: { type: string }
        userId: { type: string }
        role: { type: string, enum: [admin, operator, viewer] }
        displayName: { type: string }

    AggregatedTelemetry:
      type: object
      properties:
        bucket: { type: string, format: date-time }
        avgTemp: { type: number, nullable: true }
        maxTemp: { type: number, nullable: true }
        minTemp: { type: number, nullable: true }
        avgCurrent: { type: number, nullable: true }
        maxCurrent: { type: number, nullable: true }
        avgVoltage: { type: number, nullable: true }

    DigitalTwin:
      type: object
      properties:
        assetId: { type: string, format: uuid }
        deviceId: { type: string, format: uuid, nullable: true }
        metadata: { type: object }
        liveState: { type: object }
        maintenanceHistory:
          type: array
          items:
            $ref: "#/components/schemas/TwinEvent"
        aiSummary: { type: string }
        healthScore: { type: number, nullable: true }
        healthLevel: { type: string, nullable: true, enum: [healthy, warning, critical] }
        syncedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TwinEvent:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [inspection, repair, replacement, firmware_update] }
        timestamp: { type: string, format: date-time }
        summary: { type: string }
        details: { type: string }

    AddTwinEventRequest:
      type: object
      required: [type, summary]
      properties:
        type: { type: string, enum: [inspection, repair, replacement, firmware_update] }
        summary: { type: string }
        details: { type: string }
