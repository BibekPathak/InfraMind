services:
  emqx:
    image: emqx/emqx:latest
    container_name: infra-emqx
    ports:
      - "1883:1883"
      - "8083:8083"
      - "18083:18083"
    environment:
      EMQX_DASHBOARD__DEFAULT_PASSWORD: infra123
      EMQX_AUTH__BUILTIN__TYPE: internal
      EMQX_AUTH__BUILTIN__BOOTSTRAP_USERS_FILE: /opt/emqx/etc/users.bootstrap
      EMQX_AUTHORIZATION__SOURCES__1__TYPE: built_in_database
      EMQX_AUTHORIZATION__NO_MATCH: deny
    volumes:
      - emqx-data:/opt/emqx/data
      - ./deployments/emqx/users.bootstrap:/opt/emqx/etc/users.bootstrap:ro
    networks:
      - infra-net
    healthcheck:
      test: ["CMD", "emqx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: infra-timescaledb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: infra
      POSTGRES_PASSWORD: infra
      POSTGRES_DB: inframind
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - infra-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infra -d inframind"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: infra-redis
    ports:
      - "6379:6379"
    networks:
      - infra-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../deployments/docker/backend.Dockerfile
    container_name: infra-backend
    ports:
      - "8080:8080"
    environment:
      INFRA_APP_ENV: "development"
      INFRA_SERVER_PORT: "8080"
      INFRA_DB_URL: "postgres://infra:infra@timescaledb:5432/inframind?sslmode=disable"
      INFRA_MQTT_URL: "mqtt://emqx:1883"
      INFRA_REDIS_URL: "redis://redis:6379"
      INFRA_REDIS_ENABLE_EVENTS: "true"
      INFRA_AI_URL: "http://ai:9090"
      INFRA_MQTT_API_URL: "http://emqx:18083"
      INFRA_MQTT_ADMIN_USERNAME: "mqtt_admin"
      INFRA_MQTT_ADMIN_PASSWORD: "mqtt_admin_secret"
      INFRA_AUTH_JWT_SECRET: "infra-dev-secret-do-not-use-in-prod"
      INFRA_HEARTBEAT_INTERVAL: "60s"
      INFRA_DEVICE_TIMEOUT: "2m"
      INFRA_ALERT_INTERVAL: "10s"
      INFRA_TWIN_SYNC_INTERVAL: "30s"
      INFRA_ACTION_INTERVAL: "10s"
      OTEL_EXPORTER_OTLP_ENDPOINT: "jaeger:4317"
    depends_on:
      emqx:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - infra-net

  frontend:
    build:
      context: ./frontend
      dockerfile: ../deployments/docker/frontend.Dockerfile
    container_name: infra-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8080"
    depends_on:
      - backend
    networks:
      - infra-net

  ai:
    build:
      context: ./ai
      dockerfile: ../deployments/docker/ai.Dockerfile
    container_name: infra-ai
    ports:
      - "9090:9090"
    depends_on:
      - backend
    networks:
      - infra-net

  simulator:
    build:
      context: ./simulator
      dockerfile: ../deployments/docker/simulator.Dockerfile
    container_name: infra-simulator
    environment:
      INFRA_MQTT_URL: "mqtt://emqx:1883"
      INFRA_DEVICES: "tx-001:transformer,pump-001:pump,motor-001:motor"
      INFRA_INTERVAL_MS: "2000"
      INFRA_MQTT_USERNAME: "mqtt_admin"
      INFRA_MQTT_PASSWORD: "mqtt_admin_secret"
      INFRA_BACKEND_URL: "http://backend:8080"
    depends_on:
      emqx:
        condition: service_healthy
    networks:
      - infra-net
    profiles:
      - sim

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: infra-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deployments/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - infra-net

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: infra-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - infra-net

  grafana:
    image: grafana/grafana:11.1.0
    container_name: infra-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: infra123
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deployments/monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./deployments/monitoring/grafana-dashboard-provider.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./deployments/monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/inframind.json:ro
    depends_on:
      - prometheus
    networks:
      - infra-net

networks:
  infra-net:
    driver: bridge

volumes:
  pgdata:
  grafana-data:
  emqx-data:
